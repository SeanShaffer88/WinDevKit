name: Python tool tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile tools/verify.py tools/publish.py tools/scaffold-dll.py tests/test_verify.py
      - run: python -m unittest discover -s tests -v
