# Monorepo CI for the merged kit collection under kits/.
#
# Why this exists: GitHub only runs workflows from the repository
# root, so after the 34 standalone kit repos merged into WinDevKit
# (2026-11-01), each kit's own .github/workflows/ci.yml — kept inside
# its folder for reference — is inert. This workflow is the live gate
# for the whole collection: one matrix job per kit, each running the
# canonical WinDevKit steps (templates/ci.yml) in the kit's folder,
# plus the per-kit extras five kits carry in their own CI:
#   - EmbedKit, OCRKit: ./fetch.ps1 first (pinned, SHA-256-verified
#     downloads their engines need), then an env-gated e2e proof.
#   - UpdateKit: an env-gated e2e proof (local HTTP update pipeline).
#   - ArchiveKit, ImageKit: a native-interop check against the built
#     DLL, after the release build.
# The local twin is tools/gate-kits.sh (runs tools/gate.sh per kit).
# Pain point: docs/PAIN_POINTS.md #49.
name: kits-ci
on:
  push:
    branches: [main]
    paths:
      - 'kits/**'
      - 'crates/**'
      - '.github/workflows/kits-ci.yml'
      - '.github/workflows/kits-release.yml'
  pull_request:
    paths:
      - 'kits/**'
      - 'crates/**'
      - '.github/workflows/kits-ci.yml'
      - '.github/workflows/kits-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: ${{ matrix.kit }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - ArchiveKit
          - BridgeKit
          - ClipKit
          - CrashKit
          - DiagKit
          - EmbedKit
          - FastSearch
          - FileMetaKit
          - FileOpsKit
          - FixtureKit
          - HardwareInfo
          - ImageKit
          - InstanceKit
          - JobKit
          - LinkKit
          - LogKit
          - MediaKit
          - NetKit
          - NotifyKit
          - OCRKit
          - PDFKit
          - PathKit
          - ProcessKit
          - ProviderKit
          - RegKit
          - RenameKit
          - SettingsKit
          - ShellInteropKit
          - ShellKit
          - SignKit
          - ThumbKit
          - TimeKit
          - UiProbeKit
          - UpdateKit
          - VaultKit
          - WatchKit
        include:
          - kit: ArchiveKit
            post: python tests/native_interop.py target/release/archive_kit.dll
          - kit: EmbedKit
            fetch: true
            e2e: "$env:EK_E2E='1'; $env:EK_ORT_LIB='fixtures/ort/lib/onnxruntime.dll'; $env:EK_MODEL='fixtures/model.onnx'; $env:EK_VOCAB='fixtures/vocab.txt'; cargo test --locked --test e2e -- --ignored --nocapture"
          - kit: ImageKit
            post: python tests/native_interop.py target/release/imagekit.dll
          - kit: OCRKit
            fetch: true
            e2e: "$env:OK_E2E='1'; $env:OK_TESSDATA='vendor/tessdata'; cargo test --locked --test e2e -- --ignored --nocapture"
          - kit: UpdateKit
            e2e: "$env:UK_E2E='1'; cargo test --locked --test e2e -- --ignored --nocapture"
    defaults:
      run:
        working-directory: kits/${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch pinned engine files (SHA-256 verified)
        if: matrix.fetch
        run: ./fetch.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: E2E proof (env-gated, per-kit)
        if: matrix.e2e
        run: ${{ matrix.e2e }}
      - run: cargo build --release --locked
      - name: Native independent interop
        if: matrix.post
        run: ${{ matrix.post }}

  win-common:
    name: win-common
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/win-common
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
